[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vademecum"
version = "0.1.0"
description = "Extração estruturada de legislação (HTML do Planalto e PDF) para JSON hierárquico."
readme = "README.md"
license = "MIT"
authors = [{ name = "Lucas Vinha" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pdfplumber>=0.11",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
vademecum = "vademecum.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vademecum"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # regras do próprio ruff
    "PTH",      # pathlib em vez de os.path (RNF02)
]
# RUF001-003: o domínio usa º, °, –, § de propósito; não são caracteres ambíguos aqui.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.format]
quote-style = "double"
exclude = ["*.md"]   # snippets do PRD são ilustrativos

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
markers = [
    "aceite: casos de aceite do PRD §11.2 (A1–A14)",
    "regressao: comparação com snapshot JSON versionado (PRD §11.3)",
    "rede: depende de acesso à internet (download do Planalto)",
]
